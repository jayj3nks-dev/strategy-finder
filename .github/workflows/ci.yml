name: ShadowRunner Acceptance CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Runner routing mode (auto, shadow, github)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - shadow
          - github
      wait_timeout:
        description: 'Max seconds to wait if Shadow runner is busy'
        required: false
        default: '300'
        type: string
      target_commit:
        description: 'Specific commit SHA to test (used by fallback)'
        required: false
        default: ''
        type: string
      fallback_attempt:
        description: 'Fallback attempt (0 = normal, 1 = fallback)'
        required: false
        default: '0'
        type: string
      original_run_id:
        description: 'Original run ID that triggered fallback'
        required: false
        default: ''
        type: string
      sleep_seconds:
        description: 'Optional sleep duration in workload (used for controlled testing)'
        required: false
        default: '0'
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.fallback_attempt || '0' }}
  cancel-in-progress: false

jobs:
  coordinator:
    name: Route Runner Target
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.route.outputs.target }}
      runner: ${{ steps.route.outputs.runner }}
      reason: ${{ steps.route.outputs.reason }}
      mode: ${{ steps.route.outputs.mode }}
      waited_seconds: ${{ steps.route.outputs.waited_seconds }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_commit || github.sha }}

      - name: Execute Intelligent Router
        id: route
        env:
          ROUTER_PAT: ${{ secrets.SHADOW_RUNNER_ROUTER_PAT }}
        run: |
          IS_FORK="false"
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            IS_FORK="true"
          fi
          
          MODE="${{ inputs.mode || 'auto' }}"
          if [ "${{ inputs.fallback_attempt }}" = "1" ]; then
            MODE="github"
          fi

          FORK_FLAG=""
          if [ "$IS_FORK" = "true" ]; then
            FORK_FLAG="--is-fork"
          fi

          python3 .github/scripts/ci_fallback_router.py \
            --mode "$MODE" \
            --org "${{ github.repository_owner }}" \
            --wait-timeout "${{ inputs.wait_timeout || '300' }}" \
            --required-os "linux" \
            $FORK_FLAG

  workload:
    name: Workload Execution
    needs: coordinator
    runs-on: ${{ fromJSON(needs.coordinator.outputs.runner) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_commit || github.sha }}

      - name: Setup Host Environment Paths (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $machinePath = [System.Environment]::GetEnvironmentVariable("Path", [System.EnvironmentVariableTarget]::Machine)
          $userPath = [System.Environment]::GetEnvironmentVariable("Path", [System.EnvironmentVariableTarget]::User)
          $env:Path = "$machinePath;$userPath;$env:Path"
          Write-Host "PATH configured for Windows runner."

      - name: Host Diagnostics & Metadata (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Host "=== RUNNER ENVIRONMENT METADATA ==="
          Write-Host "Target Infrastructure: ${{ needs.coordinator.outputs.target }}"
          Write-Host "Routing Reason:        ${{ needs.coordinator.outputs.reason }}"
          Write-Host "OS:                    $env:OS"
          Write-Host "Machine:               $env:COMPUTERNAME"
          Write-Host "Commit SHA:            $env:GITHUB_SHA"
          Write-Host "Fallback Attempt:      ${{ inputs.fallback_attempt || '0' }}"
          Write-Host "Python:                $(python --version)"
          Write-Host "==================================="

      - name: Host Diagnostics & Metadata (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "=== RUNNER ENVIRONMENT METADATA ==="
          echo "Target Infrastructure: ${{ needs.coordinator.outputs.target }}"
          echo "Routing Reason:        ${{ needs.coordinator.outputs.reason }}"
          echo "OS:                    $(uname -a)"
          echo "Commit SHA:            $GITHUB_SHA"
          echo "Fallback Attempt:      ${{ inputs.fallback_attempt || '0' }}"
          echo "Python:                $(python3 --version)"
          echo "==================================="

      - name: GPU Hardware Verification (If on Shadow PC)
        if: needs.coordinator.outputs.target == 'shadow-pc'
        shell: powershell
        run: |
          Write-Host "=== GPU DIAGNOSTICS ==="
          if (Get-Command nvidia-smi -ErrorAction SilentlyContinue) {
            nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader
          } else {
            Write-Host "No NVIDIA GPU found."
          }

      - name: Controlled Sleep (Windows)
        if: runner.os == 'Windows' && inputs.sleep_seconds != '' && inputs.sleep_seconds != '0'
        shell: powershell
        run: |
          Write-Host "Executing controlled sleep for ${{ inputs.sleep_seconds }} seconds..."
          Start-Sleep -Seconds ${{ inputs.sleep_seconds }}

      - name: Controlled Sleep (Linux)
        if: runner.os == 'Linux' && inputs.sleep_seconds != '' && inputs.sleep_seconds != '0'
        shell: bash
        run: |
          echo "Executing controlled sleep for ${{ inputs.sleep_seconds }} seconds..."
          sleep ${{ inputs.sleep_seconds }}

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint with flake8 (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          flake8 strategy_finder.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint with flake8 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          flake8 strategy_finder.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Test with pytest (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          pytest tests/ -v --tb=short

      - name: Test with pytest (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pytest tests/ -v --tb=short

  watchdog:
    name: Infrastructure Watchdog
    needs: coordinator
    if: needs.coordinator.outputs.target == 'shadow-pc' && (inputs.fallback_attempt == '0' || inputs.fallback_attempt == '')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_commit || github.sha }}

      - name: Run Active Watchdog Monitor
        env:
          ROUTER_PAT: ${{ secrets.SHADOW_RUNNER_ROUTER_PAT }}
        run: |
          python3 .github/scripts/ci_watchdog.py \
            --org "${{ github.repository_owner }}" \
            --repo "${{ github.event.repository.name }}" \
            --run-id "${{ github.run_id }}" \
            --workload-job-name "Workload Execution" \
            --workflow-file "ci.yml" \
            --commit-sha "${{ inputs.target_commit || github.sha }}" \
            --ref "${{ github.ref_name }}" \
            --pickup-timeout 180 \
            --poll-interval 15

  summary:
    name: Workflow Summary & Quality Gate
    needs: [coordinator, workload]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publish Summary to GitHub
        run: |
          WORKLOAD_STATUS="${{ needs.workload.result }}"
          TARGET="${{ needs.coordinator.outputs.target }}"
          REASON="${{ needs.coordinator.outputs.reason }}"
          MODE="${{ needs.coordinator.outputs.mode }}"
          RUNNER="${{ needs.coordinator.outputs.runner }}"
          ATTEMPT="${{ inputs.fallback_attempt || '0' }}"
          ORIGINAL_RUN="${{ inputs.original_run_id || 'N/A' }}"
          TESTED_COMMIT="${{ inputs.target_commit || github.sha }}"

          STATUS_ICON="✅"
          if [ "$WORKLOAD_STATUS" != "success" ]; then
            STATUS_ICON="❌"
          fi

          cat <<EOF >> $GITHUB_STEP_SUMMARY
          # $STATUS_ICON ShadowRunner Universal CI Result

          | Metric | Value |
          | :--- | :--- |
          | **Validation Status** | **$WORKLOAD_STATUS** |
          | **Active Infrastructure** | \`$TARGET\` |
          | **Assigned Runner** | \`$RUNNER\` |
          | **Routing Mode** | \`$MODE\` |
          | **Routing Reason** | $REASON |
          | **Fallback Attempt** | \`$ATTEMPT\` (Original: \`$ORIGINAL_RUN\`) |
          | **Tested Commit** | \`$TESTED_COMMIT\` |
          EOF

      - name: Enforce Truthful Gate
        run: |
          if [ "${{ needs.workload.result }}" != "success" ]; then
            echo "Workload failed or did not complete. Failing summary quality gate."
            exit 1
          fi
          echo "Workload passed successfully."
